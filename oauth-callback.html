<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>AndysNote</title>
  </head>
  <body>
    <!-- Google OAuth 팝업이 인증 코드를 들고 돌아오는 착지 지점.
         화면에 아무것도 그리지 않는다 — 코드를 여는 쪽(메인 앱)으로 넘기고 즉시 닫힌다.
         이 페이지가 존재하는 이유: 인증 URL을 직접 구성해야 access_type=offline을
         명시할 수 있고(= refresh_token을 받을 수 있고), 직접 구성한 URL에는 우리가
         소유한 redirect_uri가 필요하기 때문. Google Cloud Console의 "승인된 리디렉션
         URI"에 이 파일의 전체 URL이 등록돼 있어야 한다. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var payload = {
          source: "andysnote-oauth",
          code: params.get("code"),
          state: params.get("state"),
          error: params.get("error"),
        };
        // opener가 없으면(사용자가 이 URL을 직접 열었거나 팝업 참조가 끊긴 경우)
        // 넘길 곳이 없으므로 조용히 닫기만 한다.
        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
        }
        window.close();
      })();
    </script>
  </body>
</html>
